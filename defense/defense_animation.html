<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Defense Animation — Proposed Design</title>
<style>
/* ================================================================
   ROOT VARIABLES & RESET
   ================================================================ */
:root {
  --bg:          #0a0e17;
  --bg-card:     #111827;
  --bg-surface:  #1e293b;
  --border:      #1e3a5f;
  --text:        #e2e8f0;
  --text-dim:    #94a3b8;
  --blue:        #3b82f6;
  --blue-glow:   #3b82f680;
  --blue-light:  #60a5fa;
  --blue-dim:    #1e3a5f;
  --red:         #ef4444;
  --red-glow:    #ef444480;
  --red-light:   #f87171;
  --red-dim:     #4a1a1a;
  --green:       #22c55e;
  --green-glow:  #22c55e80;
  --green-light: #4ade80;
  --green-dim:   #0b3d1a;
  --amber:       #f59e0b;
  --purple:      #a855f7;
  --cyan:        #06b6d4;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  padding: 10px 16px;
}

/* ================================================================
   LAYOUT (16:9 Stage Container)
   ================================================================ */
.container {
  width: 100%;
  max-width: 1200px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

header {
  text-align: center;
  padding: 4px 0 2px;
}
header h1 {
  font-size: 1.40rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--blue-light), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
}
header .disclaimer {
  font-size: 0.74rem;
  color: var(--amber);
  margin-top: 2px;
  font-style: italic;
  font-weight: 500;
}

/* External Scene Header Bar above the stage (prevents overlap) */
.scene-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 6px;
}
.scene-label-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 12px;
  border-radius: 5px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: rgba(59, 130, 246, 0.15);
  border: 1px solid var(--blue);
  color: var(--blue-light);
  transition: all 0.3s ease;
}
.scene-sub-status {
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* 16:9 Stage */
.stage-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.stage-wrapper::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 1px 1px, #ffffff08 1px, transparent 0);
  background-size: 24px 24px;
  pointer-events: none;
}
.stage {
  position: relative;
  width: 100%;
  height: 100%;
}
.scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.scene svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Caption bar */
.caption-bar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.step-badge {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 0.72rem;
  font-weight: 700;
  white-space: nowrap;
  color: var(--blue-light);
  flex-shrink: 0;
}
.caption-text {
  font-size: 0.88rem;
  line-height: 1.45;
  color: var(--text);
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 2px 0 6px;
}
.ctrl-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 7px;
  padding: 6px 15px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.ctrl-btn:hover {
  background: var(--border);
  border-color: var(--blue);
}
.ctrl-btn:active { transform: scale(0.96); }
.ctrl-btn.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  min-width: 92px;
  justify-content: center;
}
.ctrl-btn.primary:hover { background: var(--blue-light); }

.progress-track {
  flex: 1;
  max-width: 300px;
  height: 5px;
  background: var(--bg-surface);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
  border-radius: 3px;
  transition: width 0.35s ease;
}

/* ================================================================
   ANIMATIONS & KEYFRAMES (PURE OPACITY & STROKE — ZERO TRANSFORMS)
   ================================================================ */

/* Stagger delay utility classes */
.d-0  { animation-delay: 0.00s !important; }
.d-1  { animation-delay: 0.15s !important; }
.d-2  { animation-delay: 0.35s !important; }
.d-3  { animation-delay: 0.55s !important; }
.d-4  { animation-delay: 0.80s !important; }
.d-5  { animation-delay: 1.10s !important; }
.d-6  { animation-delay: 1.40s !important; }
.d-7  { animation-delay: 1.75s !important; }
.d-8  { animation-delay: 2.10s !important; }
.d-9  { animation-delay: 2.45s !important; }
.d-10 { animation-delay: 2.85s !important; }
.d-11 { animation-delay: 3.25s !important; }

/* 1. Staggered Fade-In (NO transform!) */
@keyframes fadeInOnly {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.anim-fade {
  opacity: 0;
  animation: fadeInOnly 0.45s ease forwards;
  animation-fill-mode: both;
}

/* 2. Flowing Dashed Arrow */
@keyframes flowDash {
  to { stroke-dashoffset: -20; }
}
.flow-arrow {
  stroke-dasharray: 8 6;
  animation: flowDash 0.8s linear infinite;
}

/* 3. Strike-Through for Dropped Items */
@keyframes strikeLine {
  from { stroke-dashoffset: 300; opacity: 0; }
  to   { stroke-dashoffset: 0; opacity: 1; }
}
.anim-strike {
  stroke-dasharray: 300;
  stroke-dashoffset: 300;
  animation: strikeLine 0.55s ease forwards;
  animation-fill-mode: both;
}

/* 4. Dropped Element Fade to 35% opacity */
@keyframes fadeDrop {
  from { opacity: 1; }
  to   { opacity: 0.35; }
}
.anim-dropped {
  animation: fadeDrop 0.60s ease forwards;
  animation-fill-mode: both;
}

/* 5. Scan Line Pulse */
@keyframes scanPulse {
  0%, 100% { opacity: 0.3; }
  50%      { opacity: 1.0; }
}
.anim-scan {
  animation: scanPulse 1.6s ease-in-out infinite;
}

/* 6. Poison Glow Pulse */
@keyframes poisonGlowPulse {
  0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px var(--red)); }
  50%      { opacity: 1.00; filter: drop-shadow(0 0 10px var(--red-light)); }
}
.poison-pulse {
  animation: poisonGlowPulse 1.6s ease-in-out infinite;
}

/* Comparison Table (Scene 5) */
.comp-table-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px 30px;
}
.comp-table {
  width: 100%;
  max-width: 1120px;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.85rem;
}
.comp-table th, .comp-table td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  line-height: 1.4;
}
.comp-table th {
  background: var(--bg-surface);
  color: var(--blue-light);
  font-weight: 700;
  font-size: 0.80rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.comp-table tr:last-child td { border-bottom: none; }
.comp-table td:first-child { font-weight: 600; }
.comp-table tr:nth-child(even) td { background: #0f172a; }
.comp-table tr:nth-child(odd) td { background: var(--bg-card); }
.comp-table .ours td {
  background: #092617 !important;
  border-left: 3px solid var(--green);
}
.comp-table .aims {
  color: var(--amber);
  font-style: italic;
  font-size: 0.80rem;
  font-weight: 600;
}

/* Static Mode (used for screenshots / headless verification) */
.static-mode *, .static-mode *::before, .static-mode *::after {
  animation-duration: 0.001s !important;
  animation-delay: 0s !important;
}
.static-mode .flow-arrow,
.static-mode .poison-pulse,
.static-mode .anim-scan {
  animation: none !important;
}
.static-mode .anim-fade {
  animation: none !important;
  opacity: 1 !important;
}
.static-mode .anim-strike {
  stroke-dashoffset: 0 !important;
  opacity: 1 !important;
}
.static-mode .anim-dropped {
  animation: none !important;
  opacity: 0.35 !important;
}

/* Reduced Motion Mode */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001s !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001s !important;
  }
  .flow-arrow, .poison-pulse, .anim-scan {
    animation: none !important;
  }
  .anim-fade {
    opacity: 1 !important;
  }
  .anim-strike {
    stroke-dashoffset: 0 !important;
    opacity: 1 !important;
  }
  .anim-dropped {
    opacity: 0.35 !important;
  }
}

/* Responsive adjust */
@media (max-width: 800px) {
  .comp-table { font-size: 0.72rem; }
  .comp-table th, .comp-table td { padding: 8px 10px; }
  header h1 { font-size: 1.15rem; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Defending RAG Against Knowledge-Base Poisoning</h1>
    <div class="disclaimer">Proposed defense design, not yet evaluated</div>
  </header>

  <!-- External Scene Header Bar (above stage, never overlaps SVG) -->
  <div class="scene-header-bar">
    <div class="scene-label-tag" id="sceneLabelTag">SCENE 1 — NORMAL RAG</div>
    <div class="scene-sub-status" id="sceneSubStatus">Step 1 of 12</div>
  </div>

  <!-- 16:9 Stage (viewBox="0 0 1280 720") -->
  <div class="stage-wrapper">
    <div class="stage" id="stage"></div>
  </div>

  <div class="caption-bar">
    <div class="step-badge" id="stepBadge">STEP 1 / 12</div>
    <div class="caption-text" id="captionText">Loading…</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnRestart" title="Restart (R)">⟲ Restart</button>
    <button class="ctrl-btn" id="btnPrev" title="Previous (← / J)">◂ Prev</button>
    <button class="ctrl-btn primary" id="btnPlayPause" title="Play / Pause (Space / K)">▶ Play</button>
    <button class="ctrl-btn" id="btnNext" title="Next (→ / L)">Next ▸</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<script>
// ================================================================
//  THEME COLORS & PALETTE
// ================================================================
const C = {
  blue:       '#3b82f6',
  blueLight:  '#60a5fa',
  blueDim:    '#1e3a5f',
  red:        '#ef4444',
  redLight:   '#f87171',
  redDim:     '#4a1a1a',
  green:      '#22c55e',
  greenLight: '#4ade80',
  greenDim:   '#0b3d1a',
  amber:      '#f59e0b',
  purple:     '#a855f7',
  cyan:       '#06b6d4',
  text:       '#e2e8f0',
  textDim:    '#94a3b8',
  bg:         '#111827',
  surface:    '#1e293b',
};

// ================================================================
//  SVG DEFS & FILTERS
// ================================================================
function svgDefs() {
  return `<defs>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,1 L9,4 L0,7 Z" fill="${C.blue}"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,1 L9,4 L0,7 Z" fill="${C.red}"/>
    </marker>
    <marker id="ah-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,1 L9,4 L0,7 Z" fill="${C.green}"/>
    </marker>
    <marker id="ah-dim" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,1 L9,4 L0,7 Z" fill="${C.textDim}"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,1 L9,4 L0,7 Z" fill="${C.amber}"/>
    </marker>
    <marker id="ah-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,1 L9,4 L0,7 Z" fill="${C.cyan}"/>
    </marker>
  </defs>`;
}

// ================================================================
//  SVG COMPONENT HELPERS (1280x720 Scale)
// ================================================================

/* Multi-line SVG text label (supports \n via tspans) */
function label(x, y, text, color=C.textDim, size=11, opts={}) {
  const anchor = opts.anchor || 'middle';
  const weight = opts.bold ? '700' : '400';
  const style = opts.italic ? 'font-style="italic"' : '';
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  const lines = String(text).split('\n');
  if (lines.length === 1) {
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${color}" font-size="${size}" font-weight="${weight}" ${style} ${cls} font-family="inherit">${text}</text>`;
  }
  const lineHeight = opts.lineHeight || (size * 1.35);
  const tspans = lines.map((l, i) =>
    `<tspan x="${x}" dy="${i === 0 ? 0 : lineHeight}">${l}</tspan>`
  ).join('');
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${color}" font-size="${size}" font-weight="${weight}" ${style} ${cls} font-family="inherit">${tspans}</text>`;
}

/* Document Icon with folded corner */
function iconDoc(x, y, w, h, color, labelText, extra='', opts={}) {
  const fold = 10;
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  return `<g transform="translate(${x},${y})" ${extra} ${cls}>
    <path d="M0,0 H${w-fold} L${w},${fold} V${h} H0 Z" fill="${color}20" stroke="${color}" stroke-width="1.5" rx="2"/>
    <path d="M${w-fold},0 V${fold} H${w}" fill="none" stroke="${color}" stroke-width="1"/>
    ${labelText ? `<text x="${w/2}" y="${h+15}" text-anchor="middle" fill="${C.textDim}" font-size="10" font-family="inherit">${labelText}</text>` : ''}
  </g>`;
}

/* Cylinder (Vector Database) */
function iconDB(x, y, w, h, color, labelText, subLabel='Vector DB', opts={}) {
  const ry = 12;
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  return `<g transform="translate(${x},${y})" ${cls}>
    <path d="M0,${ry} V${h-ry}" stroke="${color}" stroke-width="1.5" fill="none"/>
    <path d="M${w},${ry} V${h-ry}" stroke="${color}" stroke-width="1.5" fill="none"/>
    <ellipse cx="${w/2}" cy="${ry}" rx="${w/2}" ry="${ry}" fill="${color}22" stroke="${color}" stroke-width="1.5"/>
    <ellipse cx="${w/2}" cy="${h-ry}" rx="${w/2}" ry="${ry}" fill="${color}18" stroke="${color}" stroke-width="1.5"/>
    <rect x="0" y="${ry}" width="${w}" height="${h-2*ry}" fill="${color}12"/>
    ${labelText ? `<text x="${w/2}" y="${h/2+4}" text-anchor="middle" fill="${C.text}" font-size="12" font-weight="600" font-family="inherit">${labelText}</text>` : ''}
    <text x="${w/2}" y="${h+18}" text-anchor="middle" fill="${C.textDim}" font-size="10.5" font-family="inherit">${subLabel}</text>
  </g>`;
}

/* LLM Brain node */
function iconLLM(x, y, labelText, opts={}) {
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  return `<g transform="translate(${x},${y})" ${cls}>
    <rect x="0" y="0" width="80" height="58" rx="8" fill="${C.purple}18" stroke="${C.purple}" stroke-width="1.5"/>
    <text x="40" y="25" text-anchor="middle" fill="${C.purple}" font-size="20">🧠</text>
    <text x="40" y="44" text-anchor="middle" fill="${C.text}" font-size="10" font-weight="600" font-family="inherit">LLM</text>
    ${labelText ? `<text x="40" y="74" text-anchor="middle" fill="${C.textDim}" font-size="10" font-family="inherit">${labelText}</text>` : ''}
  </g>`;
}

/* User avatar */
function iconUser(x, y, labelText, opts={}) {
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  return `<g transform="translate(${x},${y})" ${cls}>
    <circle cx="22" cy="15" r="13" fill="${C.cyan}20" stroke="${C.cyan}" stroke-width="1.5"/>
    <text x="22" y="20" text-anchor="middle" fill="${C.cyan}" font-size="16">👤</text>
    <path d="M5,45 Q5,28 22,28 Q39,28 39,45" fill="${C.cyan}15" stroke="${C.cyan}" stroke-width="1.5"/>
    ${labelText ? `<text x="22" y="60" text-anchor="middle" fill="${C.textDim}" font-size="10.5" font-family="inherit">${labelText}</text>` : ''}
  </g>`;
}

/* Attacker avatar */
function iconAttacker(x, y, opts={}) {
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  return `<g transform="translate(${x},${y})" ${cls}>
    <circle cx="22" cy="15" r="13" fill="${C.red}20" stroke="${C.red}" stroke-width="1.5"/>
    <text x="22" y="20" text-anchor="middle" font-size="16">💀</text>
    <path d="M5,45 Q5,28 22,28 Q39,28 39,45" fill="${C.red}15" stroke="${C.red}" stroke-width="1.5"/>
    <text x="22" y="60" text-anchor="middle" fill="${C.redLight}" font-size="10.5" font-weight="600" font-family="inherit">Attacker</text>
  </g>`;
}

/* Shield icon */
function iconShield(x, y, w, h, color, labelText, opts={}) {
  const hw = w/2;
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  return `<g transform="translate(${x},${y})" filter="url(#glowGreen)" ${cls}>
    <path d="M${hw},0 L${w},${h*0.3} L${w},${h*0.65} Q${hw},${h} ${hw},${h} Q${hw},${h} 0,${h*0.65} L0,${h*0.3} Z"
          fill="${color}25" stroke="${color}" stroke-width="2"/>
    <text x="${hw}" y="${h*0.52}" text-anchor="middle" fill="${color}" font-size="18">🛡️</text>
    ${labelText ? `<text x="${hw}" y="${h+16}" text-anchor="middle" fill="${color}" font-size="9.5" font-weight="700" font-family="inherit">${labelText}</text>` : ''}
  </g>`;
}

/* Rounded Box */
function box(x, y, w, h, color, text, opts={}) {
  const fontSize = opts.fontSize || 10.5;
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  const lines = String(text).split('\n');
  let textMarkup = '';
  if (lines.length === 1) {
    textMarkup = `<text x="${x+w/2}" y="${y+h/2+fontSize/3}" text-anchor="middle" fill="${color}" font-size="${fontSize}" font-weight="600" font-family="inherit">${text}</text>`;
  } else {
    const lineH = fontSize * 1.35;
    const startY = y + (h - (lines.length - 1) * lineH) / 2 + fontSize / 3;
    const tspans = lines.map((l, i) => `<tspan x="${x+w/2}" dy="${i === 0 ? 0 : lineH}">${l}</tspan>`).join('');
    textMarkup = `<text x="${x+w/2}" y="${startY}" text-anchor="middle" fill="${color}" font-size="${fontSize}" font-weight="600" font-family="inherit">${tspans}</text>`;
  }
  return `<g ${cls}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${color}18" stroke="${color}" stroke-width="1.5"/>
    ${textMarkup}
  </g>`;
}

/* Answer / Query Bubble with multi-line text */
function answerBubble(x, y, w, text, color, icon='', opts={}) {
  const lines = String(text).split('\n');
  const lineH = 16;
  const padY = 12;
  const h = padY * 2 + lines.length * lineH;
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  let t = '';
  lines.forEach((line, i) => {
    t += `<text x="${x+14}" y="${y+padY+12+i*lineH}" fill="${color}" font-size="11" font-family="inherit">${line}</text>`;
  });
  return `<g ${cls}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${color}12" stroke="${color}" stroke-width="1.2"/>
    ${icon ? `<text x="${x+w-22}" y="${y+22}" font-size="16">${icon}</text>` : ''}
    ${t}
  </g>`;
}

/* Check Item (Pass or Fail) */
function checkItem(x, y, text, pass, color, opts={}) {
  const icon = pass ? '✓' : '✗';
  const c = pass ? C.green : C.red;
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  return `<g ${cls}>
    <text x="${x}" y="${y}" fill="${c}" font-size="14" font-weight="700" font-family="inherit">${icon}</text>
    <text x="${x+20}" y="${y}" fill="${color || C.text}" font-size="11" font-family="inherit">${text}</text>
  </g>`;
}

/* Straight Arrow (wrapped in group so anim-fade opacity never overrides flowDash animation) */
function arrow(x1, y1, x2, y2, color, opts={}) {
  const marker = color === C.red ? 'ah-red' : color === C.green ? 'ah-green' : color === C.amber ? 'ah-amber' : color === C.cyan ? 'ah-cyan' : color === C.textDim ? 'ah-dim' : 'ah-blue';
  const sw = opts.thick ? '2.5' : '2.0';
  const dash = opts.dashed ? 'stroke-dasharray="6 4"' : (opts.flow ? 'stroke-dasharray="8 6"' : '');
  const lineCls = opts.flow ? 'class="flow-arrow"' : '';
  const gCls = opts.cls ? `class="${opts.cls}"` : '';
  return `<g ${gCls}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${sw}" marker-end="url(#${marker})" ${lineCls} ${dash}/></g>`;
}

/* Curved Arrow (wrapped in group) */
function curveArrow(x1, y1, cx, cy, x2, y2, color, opts={}) {
  const marker = color === C.red ? 'ah-red' : color === C.green ? 'ah-green' : color === C.cyan ? 'ah-cyan' : 'ah-blue';
  const sw = opts.thick ? '2.5' : '2.0';
  const dash = opts.dashed ? 'stroke-dasharray="6 4"' : (opts.flow ? 'stroke-dasharray="8 6"' : '');
  const pathCls = opts.flow ? 'class="flow-arrow"' : '';
  const gCls = opts.cls ? `class="${opts.cls}"` : '';
  return `<g ${gCls}><path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" stroke="${color}" stroke-width="${sw}" fill="none" marker-end="url(#${marker})" ${pathCls} ${dash}/></g>`;
}

/* 2D Embedding Space Scatter Visualization (1280x720 coordinates) */
function embeddingSpace(x, y, w, h, points, opts={}) {
  const cls = opts.cls ? `class="${opts.cls}"` : '';
  let dots = '';
  points.forEach(p => {
    const glow = p.glow ? `filter="url(#glow${p.glow})"` : '';
    const r = p.r || 5;
    const dotCls = p.cls ? `class="${p.cls}"` : '';
    const dotX = x + p.px * w;
    const dotY = y + p.py * h;
    const labelX = dotX + (p.lx !== undefined ? p.lx : (r + 6));
    const labelY = dotY + (p.ly !== undefined ? p.ly : 4);
    const anchor = p.anchor || 'start';
    const weight = p.bold ? '700' : '400';
    dots += `<g ${dotCls}>
      <circle cx="${dotX}" cy="${dotY}" r="${r}" fill="${p.color}" opacity="${p.opacity||0.85}" ${glow}/>
      ${p.label ? `<text x="${labelX}" y="${labelY}" text-anchor="${anchor}" fill="${p.color}" font-size="9.5" font-weight="${weight}" font-family="inherit">${p.label}</text>` : ''}
    </g>`;
  });
  return `<g ${cls}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#0b1120" stroke="${C.blueDim}" stroke-width="1.2"/>
    <text x="${x+w/2}" y="${y-8}" text-anchor="middle" fill="${C.textDim}" font-size="10.5" font-family="inherit">2D Embedding Space Projection (sentence-transformers / all-MiniLM-L6-v2)</text>
    ${dots}
  </g>`;
}

// ================================================================
//  CONTROLLER & STATE
// ================================================================
let currentStep = 0;
let playing = false;
let timer = null;
const STEP_DURATION = 5500; // ms per step (approx 5.5s)

const stage          = document.getElementById('stage');
const captionText    = document.getElementById('captionText');
const stepBadge      = document.getElementById('stepBadge');
const progressFill   = document.getElementById('progressFill');
const sceneLabelTag  = document.getElementById('sceneLabelTag');
const sceneSubStatus = document.getElementById('sceneSubStatus');
const btnPlay        = document.getElementById('btnPlayPause');
const btnNext        = document.getElementById('btnNext');
const btnPrev        = document.getElementById('btnPrev');
const btnRestart     = document.getElementById('btnRestart');

/* Re-renders the scene DOM cleanly so opacity entrance animations replay smoothly */
function renderStep(index) {
  currentStep = Math.max(0, Math.min(index, STEPS.length - 1));
  const step = STEPS[currentStep];

  // Completely wipe stage and recreate
  stage.innerHTML = '';
  const sceneDiv = document.createElement('div');
  sceneDiv.className = 'scene';
  sceneDiv.id = `scene-${currentStep}`;
  sceneDiv.innerHTML = step.render();
  stage.appendChild(sceneDiv);

  // Update external scene header bar (above stage, never overlaps SVG)
  if (step.sceneLabel) {
    sceneLabelTag.textContent = step.sceneLabel;
    sceneLabelTag.style.borderColor = step.sceneColor || C.blue;
    sceneLabelTag.style.color = step.sceneColor || C.blueLight;
    sceneLabelTag.style.background = (step.sceneColor || C.blue) + '20';
  }
  sceneSubStatus.textContent = `Step ${currentStep + 1} of ${STEPS.length}`;

  // Update caption & dynamic badge
  captionText.textContent = step.caption;
  stepBadge.textContent = `STEP ${currentStep + 1} / ${STEPS.length}`;

  // Update progress bar
  progressFill.style.width = `${((currentStep + 1) / STEPS.length) * 100}%`;
}

function next() {
  if (currentStep < STEPS.length - 1) {
    renderStep(currentStep + 1);
  } else if (playing) {
    pause();
  }
}

function prev() {
  if (currentStep > 0) {
    renderStep(currentStep - 1);
  }
}

function play() {
  // If user presses Play on the last step, restart from step 1
  if (currentStep >= STEPS.length - 1) {
    renderStep(0);
  }
  playing = true;
  btnPlay.textContent = '⏸ Pause';
  clearInterval(timer);
  timer = setInterval(() => {
    if (currentStep < STEPS.length - 1) {
      next();
    } else {
      pause();
    }
  }, STEP_DURATION);
}

function pause() {
  playing = false;
  btnPlay.textContent = '▶ Play';
  clearInterval(timer);
  timer = null;
}

function restart() {
  pause();
  renderStep(0);
}

// Expose global navigation for automated verification
window.goToStep = function(n) {
  pause();
  renderStep(n);
};

// ================================================================
//  EVENT LISTENERS & SHORTCUTS
// ================================================================
btnPlay.addEventListener('click', () => playing ? pause() : play());
btnNext.addEventListener('click', () => { pause(); next(); });
btnPrev.addEventListener('click', () => { pause(); prev(); });
btnRestart.addEventListener('click', restart);

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ' || e.key === 'k' || e.key === 'K') {
    e.preventDefault();
    playing ? pause() : play();
  } else if (e.key === 'ArrowRight' || e.key === 'l' || e.key === 'L') {
    pause();
    next();
  } else if (e.key === 'ArrowLeft' || e.key === 'j' || e.key === 'J') {
    pause();
    prev();
  } else if (e.key === 'r' || e.key === 'R') {
    restart();
  }
});

// Check URL parameters for direct step navigation (useful for screenshots)
const urlParams = new URLSearchParams(window.location.search);
const paramStep = urlParams.get('step');
const isStatic = urlParams.get('static') === '1';
if (isStatic) {
  document.documentElement.classList.add('static-mode');
}
const startStep = paramStep !== null ? parseInt(paramStep, 10) : 0;
renderStep(isNaN(startStep) ? 0 : startStep);
</script>
