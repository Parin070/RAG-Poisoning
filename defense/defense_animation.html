<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Defense Animation — Proposed Design</title>
<style>
/* ================================================================
   ROOT VARIABLES & RESET
   ================================================================ */
:root {
  --bg:         #0a0e17;
  --bg-card:    #111827;
  --bg-surface: #1e293b;
  --border:     #1e3a5f;
  --text:       #e2e8f0;
  --text-dim:   #94a3b8;
  --blue:       #3b82f6;
  --blue-glow:  #3b82f680;
  --blue-light: #60a5fa;
  --red:        #ef4444;
  --red-glow:   #ef444480;
  --red-light:  #f87171;
  --green:      #22c55e;
  --green-glow: #22c55e80;
  --green-light:#4ade80;
  --amber:      #f59e0b;
  --purple:     #a855f7;
  --cyan:       #06b6d4;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* ================================================================
   LAYOUT
   ================================================================ */
.container {
  width: 100%;
  max-width: 1300px;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
}

header {
  text-align: center;
  padding: 8px 0;
}
header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--blue-light), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
}
header .disclaimer {
  font-size: 0.75rem;
  color: var(--amber);
  margin-top: 4px;
  font-style: italic;
  opacity: 0.9;
}

/* ---- Stage ---- */
.stage-wrapper {
  position: relative;
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  flex: 1;
  min-height: 420px;
}
.stage-wrapper::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 1px 1px, #ffffff06 1px, transparent 0);
  background-size: 32px 32px;
  pointer-events: none;
}
.stage {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 420px;
}
.scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
.scene.active {
  opacity: 1;
  pointer-events: auto;
}
.scene svg {
  width: 100%;
  height: 100%;
}

/* ---- Scene label (top-left) ---- */
.scene-label {
  position: absolute;
  top: 12px;
  left: 16px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 3px 10px;
  border-radius: 4px;
  z-index: 10;
  pointer-events: none;
}

/* ---- Caption ---- */
.caption-bar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 20px;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.step-badge {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 0.72rem;
  font-weight: 700;
  white-space: nowrap;
  color: var(--blue-light);
  flex-shrink: 0;
}
.caption-text {
  font-size: 0.92rem;
  line-height: 1.45;
  color: var(--text);
  transition: opacity 0.3s;
}

/* ---- Controls ---- */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 6px 0 10px;
}
.ctrl-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 18px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.ctrl-btn:hover {
  background: var(--border);
  border-color: var(--blue);
}
.ctrl-btn:active { transform: scale(0.96); }
.ctrl-btn.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  min-width: 100px;
  justify-content: center;
}
.ctrl-btn.primary:hover { background: var(--blue-light); }

/* Progress bar */
.progress-track {
  flex: 1;
  max-width: 320px;
  height: 4px;
  background: var(--bg-surface);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* ================================================================
   SVG STYLES
   ================================================================ */

/* Glow filters are defined in SVG defs */

.node-box {
  transition: opacity 0.5s, transform 0.5s;
}

/* Flow animation along arrows */
@keyframes flowDash {
  to { stroke-dashoffset: -20; }
}
.flow-arrow {
  stroke-dasharray: 8 6;
  animation: flowDash 0.8s linear infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
.pulse { animation: pulse 1.6s ease-in-out infinite; }

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-up {
  animation: fadeSlideUp 0.6s ease forwards;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

@keyframes scanLine {
  0%   { transform: translateY(0); opacity: 0.8; }
  100% { transform: translateY(60px); opacity: 0; }
}

/* Comparison table */
.comp-table {
  width: 90%;
  max-width: 900px;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.82rem;
  margin: 0 auto;
}
.comp-table th, .comp-table td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.comp-table th {
  background: var(--bg-surface);
  color: var(--blue-light);
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.comp-table tr:last-child td { border-bottom: none; }
.comp-table td:first-child { font-weight: 600; }
.comp-table tr:nth-child(even) td { background: #0f172a; }
.comp-table tr:nth-child(odd) td { background: var(--bg-card); }
.comp-table .ours td {
  background: #0b2a1a !important;
  border-left: 3px solid var(--green);
}
.comp-table .aims {
  color: var(--amber);
  font-style: italic;
  font-size: 0.78rem;
}

/* Responsive */
@media (max-width: 700px) {
  .container { padding: 8px 10px; }
  header h1 { font-size: 1.15rem; }
  .caption-text { font-size: 0.82rem; }
  .ctrl-btn { padding: 6px 12px; font-size: 0.78rem; }
  .stage-wrapper { min-height: 320px; }
  .stage { min-height: 320px; }
  .comp-table { font-size: 0.7rem; }
  .comp-table th, .comp-table td { padding: 6px 8px; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Defending RAG Against Knowledge-Base Poisoning</h1>
    <div class="disclaimer">Proposed defense design, not yet evaluated</div>
  </header>

  <div class="stage-wrapper">
    <div class="stage" id="stage"></div>
  </div>

  <div class="caption-bar">
    <div class="step-badge" id="stepBadge">STEP 1 / 15</div>
    <div class="caption-text" id="captionText">Loading…</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnRestart" title="Restart">⟲ Restart</button>
    <button class="ctrl-btn" id="btnPrev" title="Previous">◂ Prev</button>
    <button class="ctrl-btn primary" id="btnPlayPause" title="Play / Pause">▶ Play</button>
    <button class="ctrl-btn" id="btnNext" title="Next">Next ▸</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<!-- ============================================================
     MAIN SCRIPT
     ============================================================ -->
<script>
// ================================================================
//  SVG ICON HELPERS (return markup strings)
// ================================================================

const C = {
  blue: '#3b82f6', blueLight: '#60a5fa', blueDim: '#1e3a5f',
  red: '#ef4444', redLight: '#f87171', redDim: '#4a1a1a',
  green: '#22c55e', greenLight: '#4ade80', greenDim: '#0b3d1a',
  amber: '#f59e0b', purple: '#a855f7', cyan: '#06b6d4',
  text: '#e2e8f0', textDim: '#94a3b8', bg: '#111827', surface: '#1e293b',
};

function svgDefs() {
  return `<defs>
    <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="${C.blue}"/>
    </marker>
    <marker id="ah-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="${C.red}"/>
    </marker>
    <marker id="ah-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="${C.green}"/>
    </marker>
    <marker id="ah-dim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="${C.textDim}"/>
    </marker>
    <marker id="ah-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="${C.amber}"/>
    </marker>
  </defs>`;
}

/* Document icon: rectangle with folded corner */
function iconDoc(x, y, w, h, color, label, extra='') {
  const fold = 10;
  return `<g transform="translate(${x},${y})" ${extra}>
    <path d="M0,0 H${w-fold} L${w},${fold} V${h} H0 Z" fill="${color}20" stroke="${color}" stroke-width="1.5" rx="2"/>
    <path d="M${w-fold},0 V${fold} H${w}" fill="none" stroke="${color}" stroke-width="1"/>
    ${label ? `<text x="${w/2}" y="${h+14}" text-anchor="middle" fill="${C.textDim}" font-size="10" font-family="inherit">${label}</text>` : ''}
  </g>`;
}

/* Small chunk rectangles */
function iconChunks(x, y, count, color) {
  let s = '';
  for (let i = 0; i < count; i++) {
    s += `<rect x="${x}" y="${y + i*14}" width="36" height="10" rx="2" fill="${color}30" stroke="${color}" stroke-width="1"/>`;
  }
  return s;
}

/* Cylinder (database) */
function iconDB(x, y, w, h, color, label) {
  const ry = 10;
  return `<g transform="translate(${x},${y})">
    <path d="M0,${ry} V${h-ry}" stroke="${color}" stroke-width="1.5" fill="none"/>
    <path d="M${w},${ry} V${h-ry}" stroke="${color}" stroke-width="1.5" fill="none"/>
    <ellipse cx="${w/2}" cy="${ry}" rx="${w/2}" ry="${ry}" fill="${color}18" stroke="${color}" stroke-width="1.5"/>
    <ellipse cx="${w/2}" cy="${h-ry}" rx="${w/2}" ry="${ry}" fill="${color}18" stroke="${color}" stroke-width="1.5"/>
    <rect x="0" y="${ry}" width="${w}" height="${h-2*ry}" fill="${color}12"/>
    ${label ? `<text x="${w/2}" y="${h/2+4}" text-anchor="middle" fill="${C.text}" font-size="11" font-weight="600" font-family="inherit">${label}</text>` : ''}
    <text x="${w/2}" y="${h+16}" text-anchor="middle" fill="${C.textDim}" font-size="10" font-family="inherit">Vector DB</text>
  </g>`;
}

/* Brain / LLM icon */
function iconLLM(x, y, label) {
  return `<g transform="translate(${x},${y})">
    <rect x="0" y="0" width="70" height="50" rx="8" fill="${C.purple}18" stroke="${C.purple}" stroke-width="1.5"/>
    <text x="35" y="22" text-anchor="middle" fill="${C.purple}" font-size="18">🧠</text>
    <text x="35" y="38" text-anchor="middle" fill="${C.text}" font-size="9" font-weight="600" font-family="inherit">LLM</text>
    ${label ? `<text x="35" y="64" text-anchor="middle" fill="${C.textDim}" font-size="10" font-family="inherit">${label}</text>` : ''}
  </g>`;
}

/* User icon */
function iconUser(x, y, label) {
  return `<g transform="translate(${x},${y})">
    <circle cx="18" cy="12" r="10" fill="${C.cyan}20" stroke="${C.cyan}" stroke-width="1.5"/>
    <text x="18" y="16" text-anchor="middle" fill="${C.cyan}" font-size="14">👤</text>
    <path d="M4,38 Q4,24 18,24 Q32,24 32,38" fill="${C.cyan}15" stroke="${C.cyan}" stroke-width="1.5"/>
    ${label ? `<text x="18" y="52" text-anchor="middle" fill="${C.textDim}" font-size="10" font-family="inherit">${label}</text>` : ''}
  </g>`;
}

/* Attacker icon */
function iconAttacker(x, y) {
  return `<g transform="translate(${x},${y})">
    <circle cx="18" cy="12" r="10" fill="${C.red}20" stroke="${C.red}" stroke-width="1.5"/>
    <text x="18" y="16" text-anchor="middle" font-size="14">💀</text>
    <path d="M4,38 Q4,24 18,24 Q32,24 32,38" fill="${C.red}15" stroke="${C.red}" stroke-width="1.5"/>
    <text x="18" y="52" text-anchor="middle" fill="${C.redLight}" font-size="10" font-weight="600" font-family="inherit">Attacker</text>
  </g>`;
}

/* Shield icon */
function iconShield(x, y, w, h, color, label) {
  const hw = w/2;
  return `<g transform="translate(${x},${y})" filter="url(#glowGreen)">
    <path d="M${hw},0 L${w},${h*0.3} L${w},${h*0.65} Q${hw},${h} ${hw},${h} Q${hw},${h} 0,${h*0.65} L0,${h*0.3} Z"
          fill="${color}25" stroke="${color}" stroke-width="2"/>
    <text x="${hw}" y="${h*0.52}" text-anchor="middle" fill="${color}" font-size="16">🛡️</text>
    ${label ? `<text x="${hw}" y="${h+14}" text-anchor="middle" fill="${color}" font-size="9" font-weight="700" font-family="inherit">${label}</text>` : ''}
  </g>`;
}

/* Arrow line */
function arrow(x1, y1, x2, y2, color, opts={}) {
  const marker = color === C.red ? 'ah-red' : color === C.green ? 'ah-green' : color === C.amber ? 'ah-amber' : color === C.textDim ? 'ah-dim' : 'ah-blue';
  const cls = opts.flow ? 'class="flow-arrow"' : '';
  const dash = opts.dashed ? 'stroke-dasharray="6 4"' : '';
  const sw = opts.thick ? '2' : '1.5';
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${sw}" marker-end="url(#${marker})" ${cls} ${dash}/>`;
}

/* Curved arrow */
function curveArrow(x1, y1, cx, cy, x2, y2, color, opts={}) {
  const marker = color === C.red ? 'ah-red' : color === C.green ? 'ah-green' : 'ah-blue';
  const cls = opts.flow ? 'class="flow-arrow"' : '';
  return `<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" stroke="${color}" stroke-width="1.5" fill="none" marker-end="url(#${marker})" ${cls}/>`;
}

/* Text label */
function label(x, y, text, color=C.textDim, size=10, opts={}) {
  const anchor = opts.anchor || 'middle';
  const weight = opts.bold ? '700' : '400';
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${color}" font-size="${size}" font-weight="${weight}" font-family="inherit">${text}</text>`;
}

/* Rounded box with text */
function box(x, y, w, h, color, text, opts={}) {
  const fontSize = opts.fontSize || 10;
  return `<g>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${color}18" stroke="${color}" stroke-width="1.5"/>
    <text x="${x+w/2}" y="${y+h/2+fontSize/3}" text-anchor="middle" fill="${color}" font-size="${fontSize}" font-weight="600" font-family="inherit">${text}</text>
  </g>`;
}

/* Answer bubble */
function answerBubble(x, y, w, text, color, icon='') {
  const lines = text.split('\n');
  const h = 16 + lines.length * 14;
  let t = '';
  lines.forEach((line, i) => {
    t += `<text x="${x+12}" y="${y+16+i*14}" fill="${color}" font-size="10.5" font-family="inherit">${line}</text>`;
  });
  return `<g>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${color}12" stroke="${color}" stroke-width="1.2"/>
    ${icon ? `<text x="${x+w-16}" y="${y+18}" font-size="14">${icon}</text>` : ''}
    ${t}
  </g>`;
}

/* 2D embedding space scatter */
function embeddingSpace(x, y, w, h, points) {
  let dots = '';
  points.forEach(p => {
    const glow = p.glow ? `filter="url(#glow${p.glow})"` : '';
    const r = p.r || 4;
    dots += `<circle cx="${x+p.px*w}" cy="${y+p.py*h}" r="${r}" fill="${p.color}" opacity="${p.opacity||0.8}" ${glow}/>`;
    if (p.label) {
      dots += `<text x="${x+p.px*w+r+4}" y="${y+p.py*h+4}" fill="${p.color}" font-size="8.5" font-family="inherit">${p.label}</text>`;
    }
  });
  return `<g>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#0f172a" stroke="${C.blueDim}" stroke-width="1"/>
    <text x="${x+w/2}" y="${y-6}" text-anchor="middle" fill="${C.textDim}" font-size="9" font-family="inherit">Embedding Space</text>
    ${dots}
  </g>`;
}

/* Check item (✓ or ✗) */
function checkItem(x, y, text, pass, color) {
  const icon = pass ? '✓' : '✗';
  const c = pass ? C.green : C.red;
  return `<g>
    <text x="${x}" y="${y}" fill="${c}" font-size="14" font-weight="700" font-family="inherit">${icon}</text>
    <text x="${x+18}" y="${y}" fill="${color || C.text}" font-size="10.5" font-family="inherit">${text}</text>
  </g>`;
}


// ================================================================
//  SCENE LABEL HELPER
// ================================================================
function sceneLabel(text, color) {
  return `<g>
    <rect x="16" y="10" width="${text.length * 7 + 20}" height="22" rx="4" fill="${color}22" stroke="${color}" stroke-width="1"/>
    <text x="26" y="25" fill="${color}" font-size="10" font-weight="700" letter-spacing="0.06em" font-family="inherit">${text}</text>
  </g>`;
}


// ================================================================
//  STEP DEFINITIONS
// ================================================================

const STEPS = [

  // ---- SCENE 1: NORMAL RAG ----
  {
    caption: "Company documents are ingested into the RAG knowledge base. Each document is split into chunks for granular retrieval.",
    scene: 'normal',
    render() {
      return `<svg viewBox="0 0 1100 480">${svgDefs()}
        ${sceneLabel('SCENE 1 — NORMAL RAG', C.blue)}

        ${label(120, 60, 'Acme Corp Documents', C.blueLight, 12, {bold:true})}
        ${iconDoc(30, 75, 44, 36, C.blue, 'VPN Reset')}
        ${iconDoc(85, 75, 44, 36, C.blue, 'Leave Policy')}
        ${iconDoc(140, 75, 44, 36, C.blue, 'Expenses')}
        ${iconDoc(55, 135, 44, 36, C.blue, 'Onboarding')}
        ${iconDoc(110, 135, 44, 36, C.blue, 'Security')}
        ${label(120, 210, '… 17 documents total', C.textDim, 9)}

        ${arrow(200, 120, 260, 120, C.blue, {flow:true})}
        ${label(230, 108, 'Chunk', C.textDim, 9)}

        ${iconChunks(270, 85, 5, C.blue)}
        ${label(290, 170, 'Chunks', C.textDim, 9)}

        ${arrow(316, 120, 370, 120, C.blue, {flow:true})}
        ${label(343, 108, 'Embed', C.textDim, 9)}

        ${box(380, 92, 80, 50, C.blue, 'Embeddings')}
        ${label(420, 160, 'all-MiniLM-L6-v2', C.textDim, 8)}

        ${arrow(468, 117, 530, 117, C.blue, {flow:true})}
        ${label(500, 106, 'Store', C.textDim, 9)}

        ${iconDB(540, 72, 80, 90, C.blue, 'FAISS')}

        ${label(580, 210, '✓ Clean index built', C.green, 10, {bold:true})}
      </svg>`;
    }
  },

  {
    caption: "A user asks a question. The query is embedded into the same vector space as the documents.",
    scene: 'normal',
    render() {
      return `<svg viewBox="0 0 1100 480">${svgDefs()}
        ${sceneLabel('SCENE 1 — NORMAL RAG', C.blue)}

        ${iconDB(140, 80, 80, 90, C.blue, 'FAISS')}
        ${label(180, 210, 'Vector DB', C.textDim, 9)}

        ${iconUser(450, 60, 'Employee')}

        ${answerBubble(400, 120, 210, '"How do I reset my\\nVPN password?"', C.cyan)}

        ${arrow(485, 168, 485, 230, C.cyan, {flow:true})}
        ${label(510, 210, 'Embed query', C.textDim, 9)}

        ${box(445, 238, 80, 36, C.cyan, 'Query Vector')}

        ${arrow(444, 256, 228, 140, C.blue, {flow:true})}
        ${label(310, 180, 'Similarity search', C.textDim, 9)}

        ${embeddingSpace(680, 60, 200, 160, [

// ================================================================
//  ANIMATION CONTROLLER
// ================================================================

let currentStep = 0;
let playing = false;
let timer = null;
const STEP_DURATION = 5000; // ms per step during auto-play

const stage       = document.getElementById('stage');
const captionText = document.getElementById('captionText');
const stepBadge   = document.getElementById('stepBadge');
const progressFill= document.getElementById('progressFill');
const btnPlay     = document.getElementById('btnPlayPause');
const btnNext     = document.getElementById('btnNext');
const btnPrev     = document.getElementById('btnPrev');
const btnRestart  = document.getElementById('btnRestart');

function renderStep(index) {
  currentStep = Math.max(0, Math.min(index, STEPS.length - 1));
  const step = STEPS[currentStep];

  // Create or reuse scene container
  const sceneId = `scene-${currentStep}`;
  let existingScene = document.getElementById(sceneId);

  // Deactivate all scenes
  stage.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));

  if (!existingScene) {
    existingScene = document.createElement('div');
    existingScene.className = 'scene';
    existingScene.id = sceneId;
    existingScene.innerHTML = step.render();
    stage.appendChild(existingScene);
    // Force reflow for transition
    existingScene.offsetHeight;
  }

  existingScene.classList.add('active');

  // Update caption
  captionText.textContent = step.caption;
  stepBadge.textContent = `STEP ${currentStep + 1} / ${STEPS.length}`;

  // Update progress
  progressFill.style.width = `${((currentStep + 1) / STEPS.length) * 100}%`;

  // Clean up old scenes (keep current and neighbors for smooth transitions)
  stage.querySelectorAll('.scene').forEach(s => {
    const id = parseInt(s.id.replace('scene-', ''));
    if (Math.abs(id - currentStep) > 2) {
      s.remove();
    }
  });
}

function next() {
  if (currentStep < STEPS.length - 1) {
    renderStep(currentStep + 1);
  } else if (playing) {
    pause();
  }
}

function prev() {
  if (currentStep > 0) {
    renderStep(currentStep - 1);
  }
}

function play() {
  playing = true;
  btnPlay.textContent = '⏸ Pause';
  timer = setInterval(() => {
    if (currentStep < STEPS.length - 1) {
      next();
    } else {
      pause();
    }
  }, STEP_DURATION);
}

function pause() {
  playing = false;
  btnPlay.textContent = '▶ Play';
  clearInterval(timer);
  timer = null;
}

function restart() {
  pause();
  // Clear all cached scenes
  stage.innerHTML = '';
  renderStep(0);
}

// ---- Event Listeners ----
btnPlay.addEventListener('click', () => playing ? pause() : play());
btnNext.addEventListener('click', () => { pause(); next(); });
btnPrev.addEventListener('click', () => { pause(); prev(); });
btnRestart.addEventListener('click', restart);

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'ArrowRight' || e.key === 'l') { pause(); next(); }
  if (e.key === 'ArrowLeft'  || e.key === 'j') { pause(); prev(); }
  if (e.key === 'r') { restart(); }
});

// ---- Initialize ----
renderStep(0);

</script>
